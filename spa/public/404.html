<!doctype html>
<!--
  GitHub Pages SPA deep-link fallback.

  When a user navigates directly to a path like /equilibrium/techniques/T1609,
  Pages serves this 404 because no static file sits at that path. The script
  below rewrites the URL to the SPA root with the original path encoded in the
  query string, then index.html's bootstrap pulls it back out and replaces
  state. Result: pretty URLs work on refresh and on share.

  Trade-off: the response code is still 404 to crawlers. For a private/internal
  tool this is fine; revisit if SEO matters.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>equilibrium</title>
    <script>
      (function () {
        var BASE = "/equilibrium";
        var l = window.location;
        var path = l.pathname.indexOf(BASE) === 0 ? l.pathname.slice(BASE.length) : l.pathname;
        var redirect =
          BASE +
          "/?p=" +
          encodeURIComponent(path) +
          (l.search ? "&q=" + encodeURIComponent(l.search.slice(1)) : "") +
          l.hash;
        l.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
