name: Issue to PR

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  generate-pr:
    if: contains(github.event.issue.labels.*.name, 'submission:technique') || contains(github.event.issue.labels.*.name, 'submission:detection')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse issue body to draft technique JSON
        id: parse
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
        run: node .github/scripts/parse-issue.mjs

      - name: Open or update draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: submission/issue-${{ github.event.issue.number }}
          base: main
          draft: true
          commit-message: |
            submission(issue-${{ github.event.issue.number }}): auto-generated from issue form

            ${{ github.event.issue.title }}
          title: "submission(issue-${{ github.event.issue.number }}): ${{ github.event.issue.title }}"
          body: |
            Auto-generated from #${{ github.event.issue.number }}.

            CI will validate the changed `data/techniques/*.json` against `schema/equilibrium.schema.json`.
            A maintainer must review every detection's Data Component anchoring before merge.

            Closes #${{ github.event.issue.number }}.
          labels: |
            auto-generated
            needs-review
